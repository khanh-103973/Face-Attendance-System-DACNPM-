spring.application.name=face-attendance-backend
server.address=127.0.0.1
server.port=${SERVER_PORT:8080}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/face_attendance}
spring.datasource.username=${DB_USERNAME:attendance_app}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.maximum-pool-size=5
spring.sql.init.mode=never
server.error.include-message=always
server.error.include-stacktrace=never
server.tomcat.max-http-form-post-size=20MB
server.tomcat.max-swallow-size=20MB
app.jwt.secret=${JWT_SECRET_BASE64}
app.bootstrap.admin-password=${BOOTSTRAP_ADMIN_PASSWORD:}
spring.flyway.clean-disabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
app.ai.base-url=${AI_SERVICE_URL:http://127.0.0.1:8000}
app.ai.api-key=${AI_API_KEY:}
